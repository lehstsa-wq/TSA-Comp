<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TSA Event Picker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --papaya:#fdf0d5;      /* light text on dark tiles and buttons */
  --bg:#ffffff;
  --ink:#003049;
  --steel:#669bbc;
  --steel-text:#386b8d;      /* Steel Blue, darkened just enough for small text to pass contrast on Papaya Whip */
  --red:#c1121f;
  --lava:#780000;
  --rule:rgba(102,155,188,.5);
  --line:2px solid var(--ink);
  --r-s:10px; --r-m:14px; --r-l:16px;
  --font-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-data:'Comic Sans MS','Comic Neue',cursive;
  --rail:248px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.6 var(--font-body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-body);margin:0;line-height:1.15;letter-spacing:-.01em;overflow-wrap:break-word}
h1{font-weight:900;font-size:clamp(2.3rem,4.8vw,4.1rem);letter-spacing:-.025em;line-height:1.04}
h2{font-weight:800;font-size:clamp(1.5rem,2.4vw,2.1rem)}
h3{font-weight:800;font-size:1.2rem}
p{margin:0 0 1em;max-width:64ch}
a{color:inherit;text-decoration-color:var(--steel);text-decoration-thickness:2px;text-underline-offset:4px}
a:hover{color:var(--lava)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:3px;border-radius:4px}
.data{font-family:var(--font-data)}
.muted{color:var(--steel-text)}
.opt{color:var(--steel);font-weight:700;margin-left:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-60px;background:var(--ink);color:var(--papaya);padding:10px 16px;border-radius:var(--r-s);z-index:100;transition:top .15s}
.skip:focus{top:12px}

/* ---------- left rail ---------- */
.rail{position:fixed;left:0;top:0;bottom:0;width:var(--rail);border-right:var(--line);padding:calc(28px + env(safe-area-inset-top,0px)) 20px 24px;display:flex;flex-direction:column;gap:36px;background:var(--bg);z-index:20;overflow-y:auto}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand svg{flex:none}
.brand strong{display:block;font-weight:900;font-size:1.15rem;line-height:1.1}
.brand small{font-family:var(--font-data);color:var(--steel-text);font-size:.8rem}
.nav{display:grid;gap:6px}
.nav a{position:relative;display:grid;grid-template-columns:34px 1fr auto;align-items:baseline;padding:11px 12px;border:2px solid transparent;border-radius:var(--r-s);text-decoration:none;font-weight:700;transition:border-color .2s,background .2s}
.nav a:hover{border-color:var(--ink);color:var(--ink)}
.nav .n{font-family:var(--font-data);color:var(--steel-text);font-weight:700}
.nav a[aria-current="page"]{border-color:var(--ink)}
.nav a[aria-current="page"]::before{content:"";position:absolute;left:-22px;top:10px;bottom:10px;width:6px;border-radius:0 4px 4px 0;background:var(--red)}
.nav a[aria-current="page"] .n{color:var(--red)}
.badge{font-family:var(--font-data);font-size:.8rem;border:2px solid var(--steel);border-radius:999px;padding:0 8px;line-height:1.4;color:var(--steel-text)}
.rail-note{margin-top:auto;font-family:var(--font-data);font-size:.8rem;color:var(--steel-text);line-height:1.5}

/* ---------- main ---------- */
.main{margin-left:var(--rail);padding:56px clamp(22px,4vw,72px) 110px}
.wrap{max-width:1440px;margin:0 auto;transition:opacity .2s ease}
.wrap.leaving{opacity:0}
.page-head{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:20px 48px;align-items:end;margin-bottom:48px}
.page-head p{margin:0}
.lead{font-size:1.12rem}
.sec{margin-top:96px}
.split{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:32px 64px;align-items:start}
.finder{grid-template-columns:minmax(280px,4fr) minmax(0,8fr)}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.notice{margin-top:56px;padding:16px 20px;border:2px dashed var(--steel);border-radius:var(--r-s);color:var(--steel-text);font-size:.95rem;max-width:none}
.notice a{color:var(--ink)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border:2px solid var(--ink);border-radius:var(--r-s);background:transparent;color:var(--ink);font-weight:800;font-size:.95rem;line-height:1.1;cursor:pointer;text-decoration:none;transition:background .15s,color .15s,border-color .15s}
.btn:hover{background:var(--ink);color:var(--papaya)}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--papaya)}
.btn.primary:hover,.btn.primary:active{background:var(--lava);border-color:var(--lava);color:var(--papaya)}
.btn.sm{padding:8px 13px;font-size:.86rem}
.btn.danger{background:var(--lava);border-color:var(--lava);color:var(--papaya)}
.btn.on-dark{border-color:var(--papaya);color:var(--papaya)}
.btn.on-dark:hover{background:var(--papaya);color:var(--ink)}
.linkbtn{background:none;border:0;padding:0;text-align:left;cursor:pointer;font-weight:800;font-size:1.12rem;line-height:1.3;text-decoration:underline;text-decoration-color:var(--steel);text-decoration-thickness:2px;text-underline-offset:4px}
.linkbtn:hover{color:var(--lava)}

/* ---------- bento ---------- */
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px;grid-auto-rows:minmax(150px,auto)}
.tile{border:var(--line);border-radius:var(--r-m);padding:28px;position:relative;overflow:hidden}
.tile.dark{background:var(--ink);color:var(--papaya)}
.tile.dark a{text-decoration-color:var(--steel)}
.tile.dark a:hover{color:var(--papaya)}
.tile h2{font-size:1.5rem;margin-bottom:14px}
.t-hero{grid-column:span 7;grid-row:span 2;border-radius:var(--r-l);padding:40px}
.t-cd{grid-column:span 5}
.t-count{grid-column:span 5}
.t-types{grid-column:span 7}
.t-teams{grid-column:span 5;grid-row:span 2}
.t-test{grid-column:span 4}
.t-prog{grid-column:span 3}
.hero-in{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:28px;align-items:end;height:100%}
.hero-in .art{width:150px;color:var(--ink)}
.art{display:block;width:100%;height:auto}
.big{font-weight:900;font-size:3.4rem;line-height:1;margin:6px 0 4px}
.big span{font-size:1.2rem;font-weight:700}
.ledger-list{list-style:none;margin:0;padding:0}
.ledger-list li{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:10px 0;border-bottom:2px solid var(--rule)}
.ledger-list li:last-child{border-bottom:0}
.ledger-list a{font-weight:800;text-decoration:none}
.ledger-list a:hover{text-decoration:underline}
.type-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.type-grid a{display:grid;grid-template-columns:30px 1fr;gap:4px 10px;align-items:center;padding:12px 14px;border:var(--line);border-radius:var(--r-s);text-decoration:none;transition:background .15s,color .15s}
.type-grid a:hover{background:var(--ink);color:var(--papaya)}
.type-grid b{font-weight:800;line-height:1.15}
.type-grid .data{grid-column:2;font-size:.82rem;opacity:.85}
.parts{list-style:none;margin:16px 0;padding:0}
.parts li{display:grid;grid-template-columns:130px 1fr;gap:10px;padding:9px 0;border-bottom:2px solid var(--rule);font-size:.95rem}
.parts li:last-child{border-bottom:0}
.parts .data{color:var(--steel-text);font-size:.88rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0;padding:0;list-style:none}
.chips a{display:inline-block;padding:5px 11px;border:2px solid var(--steel);border-radius:var(--r-s);font-size:.88rem;font-weight:700;text-decoration:none}
.chips a:hover{background:var(--papaya);color:var(--ink)}
.test-in{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:16px}
.test-in .art{color:var(--papaya);width:84px}
.bar{height:18px;border:2px solid var(--ink);border-radius:var(--r-s);overflow:hidden;margin:12px 0 10px}
.bar>i{display:block;height:100%;background:var(--steel);transition:width .5s ease}

/* ---------- accordion ---------- */
.acc{border:var(--line);border-radius:var(--r-m);overflow:hidden}
.acc-item+.acc-item{border-top:var(--line)}
.acc-btn{display:grid;grid-template-columns:36px 1fr auto;gap:14px;align-items:center;width:100%;padding:18px 22px;background:none;border:0;text-align:left;cursor:pointer;font-weight:800;font-size:1.08rem}
.acc-btn:hover{background:rgba(102,155,188,.18)}
.acc-btn .pm{width:14px;height:14px;position:relative}
.acc-btn .pm::before,.acc-btn .pm::after{content:"";position:absolute;left:0;right:0;top:6px;height:2px;background:var(--ink);transition:transform .3s}
.acc-btn .pm::after{transform:rotate(90deg)}
.acc-item.open .pm::after{transform:rotate(0)}
.acc-panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s ease}
.acc-panel>div{overflow:hidden;visibility:hidden;transition:visibility 0s .32s}
.acc-panel p{padding:0 22px 20px 72px;margin:0}
.acc-item.open .acc-panel{grid-template-rows:1fr}
.acc-item.open .acc-panel>div{visibility:visible;transition-delay:0s}

/* ---------- ledger forms ---------- */
.ledger{border:var(--line);border-radius:var(--r-m);padding:6px 22px 18px}
.finder .ledger{position:sticky;top:24px;max-height:calc(100vh - 48px);overflow-y:auto}
.lrow{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;align-items:end;padding:14px 0;border-bottom:2px solid var(--rule)}
.lrow>label,.lrow>.lab{font-family:var(--font-data);font-size:.86rem;color:var(--steel-text);padding-bottom:7px;line-height:1.3}
input[type=search],input[type=text],input[type=number],input[type=date],select{width:100%;background:transparent;border:0;border-bottom:2px solid var(--ink);border-radius:0;padding:7px 0;min-height:38px}
select{appearance:none;-webkit-appearance:none;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 9px) 55%,calc(100% - 4px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:20px}
input::placeholder{color:var(--steel-text);opacity:.8}
.seg{display:flex;flex-wrap:wrap;gap:4px 16px}
.seg button{background:none;border:0;border-bottom:3px solid transparent;padding:6px 0 3px;font-weight:700;font-size:.93rem;cursor:pointer}
.seg button[aria-pressed="true"]{border-bottom-color:var(--red)}
.seg button:hover{color:var(--lava)}
.ledger-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:18px;font-size:.85rem}
.tile.dark .lrow{border-bottom-color:rgba(102,155,188,.6);padding-bottom:6px}
.tile.dark .lrow>label{color:var(--steel)}
.tile.dark input{border-bottom-color:var(--papaya);color:var(--papaya);color-scheme:dark}

/* ---------- results ---------- */
.count{font-size:.9rem;color:var(--steel-text);margin:0 0 12px}
.results{list-style:none;margin:0;padding:0;border:var(--line);border-radius:var(--r-m);overflow:hidden}
.ev{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(130px,190px) auto;gap:6px 20px;align-items:center;padding:18px 22px;border-bottom:2px solid var(--rule)}
.ev:last-child{border-bottom:0}
.ev .ico{color:var(--ink)}
.ev h3{font-size:1.12rem;margin:0}
.meta{display:flex;flex-wrap:wrap;gap:2px 14px;font-family:var(--font-data);font-size:.82rem;color:var(--steel-text);margin-top:3px}
.ev .size{font-family:var(--font-data);font-size:.84rem;line-height:1.45}
.ev .size span{display:block;color:var(--steel-text)}
.state{font-family:var(--font-data);font-size:.82rem;color:var(--steel-text);margin-right:10px}
.empty{padding:44px 24px;text-align:center}
.empty .art{width:110px;margin:0 auto 12px}
.empty p{margin:0 auto 18px}

/* ---------- dialog (soft shadow allowed here) ---------- */
dialog{padding:0;border:var(--line);border-radius:var(--r-l);background:var(--bg);color:var(--ink);width:min(640px,calc(100% - 28px));max-height:calc(100% - 40px);box-shadow:0 24px 60px rgba(0,48,73,.28)}
dialog::backdrop{background:rgba(0,48,73,.55)}
.dlg{padding:30px 32px 30px}
.dlg-top{display:flex;justify-content:space-between;gap:16px;align-items:start}
.dlg h2{font-size:1.9rem;margin:6px 0 4px}
.dlg dl{margin:20px 0;border-top:2px solid var(--rule)}
.dlg dl>div{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:10px 0;border-bottom:2px solid var(--rule)}
.dlg dt{font-family:var(--font-data);font-size:.86rem;color:var(--steel-text)}
.dlg dd{margin:0}
.dlg .actions{margin-top:20px}
.x{background:none;border:var(--line);border-radius:var(--r-s);width:40px;height:40px;cursor:pointer;font-size:1.2rem;line-height:1;flex:none}
.x:hover{background:var(--ink);color:var(--papaya)}

/* ---------- lineup ---------- */
.accent-rule{width:72px;height:6px;border-radius:3px;background:var(--steel);margin:12px 0 22px}
.tbl-wrap{border:var(--line);border-radius:var(--r-m);overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th{font-family:var(--font-data);font-weight:700;font-size:.84rem;color:var(--steel-text);text-align:left;padding:12px 16px;border-bottom:2px solid var(--ink)}
td{padding:12px 16px;border-bottom:2px solid var(--rule);vertical-align:middle;font-size:.95rem}
tr:last-child td{border-bottom:0}
td select,td input{min-height:34px;font-size:.92rem}
.kanban{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.kcol{border:var(--line);border-radius:var(--r-m);padding:20px;transition:outline-color .15s;outline:3px dashed transparent;outline-offset:3px}
.kcol.over{outline-color:var(--red)}
.khead{display:grid;grid-template-columns:62px 1fr;gap:14px;align-items:center;margin-bottom:16px;padding-bottom:14px;border-bottom:4px solid var(--steel)}
.khead .art{width:62px}
.khead p{margin:0;font-family:var(--font-data);font-size:.84rem;color:var(--steel-text)}
.kbody{display:grid;gap:12px;min-height:90px;align-content:start}
.kcard{border:var(--line);border-radius:var(--r-s);padding:12px 14px;background:var(--bg);cursor:grab}
.kcard.dragging{opacity:.45}
.kcard .linkbtn{font-size:1rem}
.kcard .btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.kempty{font-family:var(--font-data);font-size:.85rem;color:var(--steel-text);margin:0;padding:6px 2px}
.pies{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:20px}
.pie-card{border:var(--line);border-radius:var(--r-m);padding:24px}
.pie-card h3{margin-bottom:16px}
.pie-card svg{width:150px;height:150px;display:block;margin-bottom:16px}
.legend{list-style:none;margin:0;padding:0;font-size:.92rem}
.legend li{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;padding:4px 0}
.legend .sw{width:14px;height:14px;border-radius:4px;border:2px solid var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.legend b{font-family:var(--font-data);font-weight:700;font-size:.85rem}
.print-only{display:none}

/* ---------- quiz ---------- */
.quiz-card{max-width:780px}
.quiz-card h2,.q-intro h2,.q-result h2{margin-bottom:10px}
.opts{display:grid;gap:10px;margin:22px 0}
.opts .opt{color:var(--ink);margin-left:0;display:grid;grid-template-columns:24px minmax(0,1fr);gap:14px;align-items:center;width:100%;text-align:left;padding:14px 18px;border:var(--line);border-radius:var(--r-s);background:transparent;cursor:pointer;font-weight:700;font-size:1.02rem;transition:border-color .15s,background .15s}
.opts .opt:hover{background:rgba(102,155,188,.16)}
.opt .mark{width:22px;height:22px;border:2px solid var(--ink);border-radius:50%}
.opts[data-multi] .mark{border-radius:6px}
.opt[aria-pressed="true"]{border-color:var(--red)}
.opt[aria-pressed="true"] .mark{background:var(--red);border-color:var(--red);box-shadow:inset 0 0 0 4px var(--bg)}
.opts[data-multi] .opt[aria-pressed="true"] .mark{box-shadow:inset 0 0 0 3px var(--bg)}
.opt .otext{display:flex;align-items:center;gap:12px}
.opt .otext svg{flex:none}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn[disabled]:hover{background:var(--red);color:var(--papaya)}
.q-intro{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:32px;align-items:center}
.q-intro .art{max-width:240px;margin:0 auto}
.summary{margin:18px 0 30px;border-top:2px solid var(--rule);max-width:760px}
.summary>div{display:grid;grid-template-columns:130px 1fr;gap:12px;padding:10px 0;border-bottom:2px solid var(--rule)}
.summary dt{font-family:var(--font-data);font-size:.86rem;color:var(--steel-text)}
.summary dd{margin:0}
.tier{display:block;font-family:var(--font-body);font-weight:800;font-size:.95rem}

/* ---------- toasts ---------- */
#toasts{position:fixed;inset:auto 0 calc(22px + env(safe-area-inset-bottom,0px)) 0;margin:0 auto;width:min(92vw,460px);height:auto;padding:0;border:0;background:transparent;overflow:visible;display:flex;flex-direction:column;gap:8px;pointer-events:none;z-index:200}
.toast{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--ink);color:var(--papaya);border-radius:var(--r-s);padding:12px 16px;font-weight:700;font-size:.93rem;opacity:0;transform:translateY(10px);transition:opacity .25s,transform .25s;pointer-events:auto}
.toast.show{opacity:1;transform:none}
.toast button{background:none;border:2px solid var(--papaya);color:var(--papaya);border-radius:var(--r-s);padding:4px 10px;font-weight:800;cursor:pointer}
.toast button:hover{background:var(--papaya);color:var(--ink)}

/* ---------- reveals ---------- */
.reveal{opacity:0;transform:translateY(14px);transition:opacity .55s ease,transform .55s ease}
.reveal.in{opacity:1;transform:none}

/* ---------- responsive ---------- */
@media (min-width:1900px){
  html{font-size:112.5%}
  :root{--rail:280px}
  .wrap{max-width:1640px}
}
@media (max-width:1180px){
  .t-hero{grid-column:span 12;grid-row:auto}
  .t-cd,.t-count{grid-column:span 6}
  .t-types{grid-column:span 12}
  .t-teams{grid-column:span 12;grid-row:auto}
  .t-test{grid-column:span 7}
  .t-prog{grid-column:span 5}
  .pies{grid-template-columns:1fr 1fr}
  .split{gap:32px 40px}
  .ev{grid-template-columns:34px minmax(0,1fr) auto}
  .ev .size{grid-column:2;grid-row:2}
}
/* rail layout with a narrow filter panel: stack labels over fields */
@media (min-width:1025px) and (max-width:1400px){
  .finder .lrow{grid-template-columns:1fr;gap:2px}
  .finder .lrow>label,.finder .lrow>.lab{padding-bottom:0}
  .ev{grid-template-columns:34px minmax(0,1fr) auto}
  .ev .size{grid-column:2;grid-row:2}
}
/* rail becomes a top bar */
@media (max-width:1024px){
  html{scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);width:auto;flex-direction:row;align-items:center;gap:18px;padding:10px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));border-right:0;border-bottom:var(--line);overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .rail-note,.brand small{display:none}
  .brand strong{white-space:nowrap}
  .nav{display:flex;gap:4px;margin-left:auto}
  .nav a{display:flex;align-items:baseline;gap:8px;white-space:nowrap;padding:8px 10px}
  .nav a>span:empty{display:none}
  .nav a[aria-current="page"]::before{left:8px;right:8px;top:auto;bottom:-2px;width:auto;height:4px;border-radius:2px}
  .main{margin-left:0;padding:34px max(clamp(16px,4vw,72px),env(safe-area-inset-right,0px)) 110px max(clamp(16px,4vw,72px),env(safe-area-inset-left,0px))}
  .page-head,.split{grid-template-columns:1fr}
  .finder .ledger{position:static;max-height:none;overflow:visible}
  .kanban{grid-template-columns:1fr}
  .sec{margin-top:72px}

function sizeRange(size,mode){
  let lo=null,hi=null; const m=size.match(/^(\d+)(?:-(\d+)|(\+))?$/);
  if(m){lo=+m[1];hi=m[2]?+m[2]:(m[3]?null:lo)}
  if(mode!=='team')lo=1;
  return {lo,hi};
}

function filtered(){

    if(F.format==='team'&&e.mode==='solo')return false;
    if(F.format==='solo'&&e.mode==='team')return false;
    if(n&&e.lo&&e.lo>n)return false;
    if(q&&!(e.name.toLowerCase().includes(q)||TYPES[e.type].label.toLowerCase().includes(q)||LEVELS[e.level].label.toLowerCase().includes(q)||(e.incl||'').toLowerCase().includes(q)))return false;
    return true;
  });
  list.sort((a,b)=>{
    if(F.sort==='type')return TYPE_KEYS.indexOf(a.type)-TYPE_KEYS.indexOf(b.type)||a.name.localeCompare(b.name);
    if(F.sort==='level')return LEVEL_ORDER[a.level]-LEVEL_ORDER[b.level]||a.name.localeCompare(b.name);
    return a.name.localeCompare(b.name)||LEVEL_ORDER[a.level]-LEVEL_ORDER[b.level];
  });
  return list;
}

function scoreQuiz(a){
  const n=parseInt(a.students,10)||1, out=[];
  EVENTS.forEach(e=>{
    if(e.mode==='team'&&e.lo&&e.lo>n)return;
    let sc=0; const why=[];
    if((a.types||[]).includes(e.type)){sc+=6;why.push('matches your interest in '+TYPES[e.type].label.toLowerCase())}
    const proj=['build','create','code','investigate'].includes(e.type);
    if(a.prep==='project'&&proj){sc+=1;why.push('leans toward project work')}
    if(a.prep==='quick'&&!proj){sc+=1;why.push('leans toward study and practice')}
    if(a.work==='solo'){
      if(e.mode==='solo'){sc+=2;why.push('individual event')}else if(e.mode==='either'){sc+=2;why.push('individuals can enter')}else sc-=3;
    }else if(a.work==='team'){
      if(e.mode==='team'){sc+=2;why.push('team event')}else if(e.mode==='either'){sc+=2;why.push('teams can enter')}else sc-=3;
    }
    if(n===1&&e.mode==='team')sc-=2;
    if(!why.length)why.push('open to high school students');
    const txt=why.join(', ');
    out.push({e,score:sc,why:txt.charAt(0).toUpperCase()+txt.slice(1),tier:sc>=7?'Strong match':sc>=4?'Good match':'Worth a look'});
  });
  out.sort((x,y)=>y.score-x.score||LEVEL_ORDER[x.e.level]-LEVEL_ORDER[y.e.level]||x.e.name.localeCompare(y.e.name));
  /* keep the list varied: cap each track, then fill up to 10 */
  const caps={nqe:5,uteo:3,utep:4,teams:1}, used={nqe:0,uteo:0,utep:0,teams:0}, pick=[];
  for(const r of out){if(pick.length===10)break;if(used[r.e.level]>=caps[r.e.level])continue;used[r.e.level]++;pick.push(r)}
  for(const r of out){if(pick.length>=10)break;if(!pick.includes(r))pick.push(r)}
  pick.sort((x,y)=>y.score-x.score||LEVEL_ORDER[x.e.level]-LEVEL_ORDER[y.e.level]||x.e.name.localeCompare(y.e.name));
  return pick;
}

  const q=QUIZ[Q.step], sel=Q.a[q.id], multi=q.type==='multi';
  return `<div class="tile quiz-card">
    <p class="data muted" style="margin:0 0 8px">Question ${Q.step+1} of ${QUIZ.length}</p>
    <div class="bar" role="progressbar" aria-valuemin="1" aria-valuemax="${QUIZ.length}" aria-valuenow="${Q.step+1}" aria-label="Quiz progress"><i style="width:${(Q.step+1)/QUIZ.length*100}%"></i></div>
    <h2 id="qh" class="q-focus">${q.q}</h2>
    ${q.hint?`<p class="muted" style="margin:0">${q.hint}</p>`:''}
    <div class="opts" role="group" aria-labelledby="qh"${multi?' data-multi':''}>
      ${q.opts.map(o=>{const on=multi?(sel||[]).includes(o[0]):sel===o[0];
        return `<button type="button" class="opt" data-act="qopt" data-v="${o[0]}" aria-pressed="${on}" data-fk="q-${o[0]}"><span class="mark" aria-hidden="true"></span><span class="otext">${multi?ico(o[0],26):''}<span>${o[1]}</span></span></button>`}).join('')}
    </div>
    <div class="actions"><button class="btn" data-act="qback">Back</button>
      <button class="btn primary" data-act="qnext"${answered()?'':' disabled'}>${Q.step===QUIZ.length-1?'See my matches':'Next question'}</button></div>
  </div>`;
}
function resultHTML(){
  const a=Q.a&&Q.a.work?Q.a:QR, res=scoreQuiz(a);
  const qs=new URLSearchParams(); if((a.types||[])[0])qs.set('type',a.types[0]);
  const types=(a.types||[]).map(k=>TYPES[k].label).join(' and ');
  return `<div class="q-result"><h2 id="qh" class="q-focus">Your top matches</h2>
    <p>Ranked by how well each event fits your answers.</p>
    <dl class="summary">
      <div><dt>Interests</dt><dd>${esc(types)}</dd></div>
      <div><dt>Work style</dt><dd>${optLabel('work',a.work)}</dd></div>
      <div><dt>Students</dt><dd>${optLabel('students',a.students)}</dd></div>
      <div><dt>Prep</dt><dd>${optLabel('prep',a.prep)}</dd></div>
    </dl>
    ${res.length?`<ol class="results">${res.map(r=>`<li class="ev">${ico(r.e.type,30)}
      <div><h3><button class="linkbtn" data-act="open" data-id="${r.e.id}">${esc(r.e.name)}</button></h3>
        <div class="meta"><span>${LEVELS[r.e.level].label}</span><span>${TYPES[r.e.type].label}</span></div></div>
      <div class="size"><span class="tier">${r.tier}</span><span>${esc(r.why)}</span></div>
      <div><button class="btn sm" data-act="open" data-id="${r.e.id}" aria-label="Details for ${esc(labelOf(r.e))}">Details</button></div></li>`).join('')}</ol>`
    :`<div class="empty">${ART.shocked}<h3>No matches</h3><p>Try different answers.</p></div>`}
    <div class="actions no-print"><button class="btn primary" data-act="qstart" data-fk="qs">Retake the quiz</button>
      <a class="btn" href="#/finder?${qs.toString()}">Browse in the Event Finder</a>
      <button class="btn" data-act="print">Print matches</button></div></div>`;
}
function renderQuiz(focusHead){
  const box=$('#quizBox'); if(!box)return;
  const ae=document.activeElement, fk=ae&&ae.dataset&&ae.dataset.fk;
  box.innerHTML=quizHTML();
  if(focusHead){
    const h=$('.q-focus',box);
    if(h){h.setAttribute('tabindex','-1');h.focus({preventScroll:true})}
    box.scrollIntoView({block:'start'});
  }else if(fk){const el=document.querySelector('[data-fk="'+fk+'"]');if(el)el.focus({preventScroll:true})}
}
function pickOption(v){
  const q=QUIZ[Q.step];
  if(q.type==='multi'){
    const arr=(Q.a[q.id]||[]).slice(), i=arr.indexOf(v);
    if(i>-1)arr.splice(i,1);else{arr.push(v);if(arr.length>q.max)arr.shift()}
    Q.a[q.id]=arr;
  }else Q.a[q.id]=v;
  renderQuiz(false);
}
function qNext(){
  if(!answered())return;
  if(Q.step<QUIZ.length-1){Q.step++;renderQuiz(true)}
  else{QR=Object.assign({},Q.a);store.set('tsa-quiz',QR);Q.mode='result';renderQuiz(true);toast('Your matches are ready')}
}
function qBack(){
  if(Q.step>0){Q.step--;renderQuiz(true)}else{Q.mode='intro';renderQuiz(true)}
}

function dialogHTML(e){
  const lv=LEVELS[e.level];
  const desc=DESC[e.id]||e.incl||`${TYPES[e.type].blurb} The rules, judging and this year\u2019s problem are in the official event guide below.`;
  const first=e.href?`<a href="${RULEBOOK}${e.href}" target="_blank" rel="noopener">Rulebook page for this event</a>`:`<a href="${lv.link}" target="_blank" rel="noopener">${lv.linkText}</a>`;
  return `<div class="dlg-top"><div><span class="muted">${ico(e.type,34)}</span><h2 id="dlgTitle">${esc(e.name)}</h2><p class="data muted" style="margin:0">${lv.label}</p></div>
    <button class="x" data-act="close" aria-label="Close details">&times;</button></div>
    <dl>
      <div><dt>Type</dt><dd>${TYPES[e.type].label}. ${TYPES[e.type].blurb}</dd></div>
      <div><dt>Who competes</dt><dd>${esc(entryText(e))}</dd></div>
      <div><dt>Entry limit</dt><dd>${esc(e.limit)}</dd></div>
      ${e.n>1?`<div><dt>In this group</dt><dd>${e.n} individual events</dd></div>`:''}
    </dl>
    <p>${esc(desc)}</p>
    ${e.level==='utep'?`<p class="muted" style="font-size:.95rem">Projects can be done alone or as a team and need the required documentation. Open the rulebook page for exact event numbers, size limits and how to submit.</p>`:''}
    <p class="data muted" style="font-size:.85rem;margin:0">${first}, <a href="${RULEBOOK}" target="_blank" rel="noopener">Texas TSA rulebook</a></p>`;
}

const VIEWS={overview:vOverview,finder:vFinder,quiz:vQuiz};
const TITLES={overview:'Overview',finder:'Event Finder',quiz:'Event Quiz'};

/* ================= rendering / routing ================= */
const view=$('#view'), dlg=$('#dlg'), dlgBody=$('#dlgBody');
let io=null;
function mountReveals(instant){
  const els=$$('.reveal',view);
  if(io){io.disconnect();io=null}
  if(instant||reduce()||!('IntersectionObserver' in window)){els.forEach(x=>x.classList.add('in'));return}
  io=new IntersectionObserver(list=>list.forEach(en=>{if(en.isIntersecting){en.target.classList.add('in');io.unobserve(en.target)}}),{rootMargin:'0px 0px -6% 0px',threshold:.06});
  els.forEach((x,i)=>{x.style.transitionDelay=(i%6)*70+'ms';io.observe(x)});
}
function updateRail(){
  $$('.nav a').forEach(a=>{if(a.dataset.page===currentPage)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
}
function drawPage(page,done,firstLoad){
  view.innerHTML=VIEWS[page]();
  if(page==='finder')renderResults(true);
  view.classList.remove('leaving');
  mountReveals();
  document.title=TITLES[page]+' \u2013 TSA Event Picker';
  updateRail();
  if(!firstLoad){window.scrollTo(0,0);const h=$('#h1',view);if(h){h.setAttribute('tabindex','-1');h.focus({preventScroll:true})}}
  if(done)done();
}
function showPage(page,done){
  const first=currentPage===null;
  currentPage=page;
  if(page==='finder')F=paramsToF(routeParams);
  if(page==='quiz')Q={mode:'intro',step:0,a:{types:[]}};
  if(first||reduce()){drawPage(page,done,first);return}
  view.classList.add('leaving');
  setTimeout(()=>drawPage(page,done,false),200);
}
let routeParams=new URLSearchParams();
function paramsToF(p){
  const f=defaultsF();
  if(['nqe','uteo','utep','teams'].includes(p.get('level')))f.level=p.get('level');
  if(TYPES[p.get('type')])f.type=p.get('type');
  if(['team','solo'].includes(p.get('format')))f.format=p.get('format');
  if(['type','level'].includes(p.get('sort')))f.sort=p.get('sort');
  if(p.get('q'))f.q=p.get('q');
  if(p.get('n')&&/^\d+$/.test(p.get('n')))f.size=p.get('n');
  return f;
}
function fToQs(){
  const p=new URLSearchParams();
  if(F.q)p.set('q',F.q); if(F.level!=='all')p.set('level',F.level); if(F.type!=='all')p.set('type',F.type);
  if(F.format!=='any')p.set('format',F.format); if(F.sort!=='name')p.set('sort',F.sort); if(F.size)p.set('n',F.size);
  return p.toString();
}
function syncFinder(){
  renderResults(false);
  $$('[data-act="level"]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===F.level)));
  finderQs=fToQs();
  try{history.replaceState(null,'','#/finder'+(finderQs?'?'+finderQs:''))}catch(e){}
}
function route(){
  const raw=location.hash.replace(/^#\/?/,'');
  const [pathRaw,qs]=raw.split('?'); const parts=pathRaw.split('/');
  let page=parts[0]||'overview', evId=null;
  if(page==='event'){evId=parts[1];page=currentPage||'finder'}
  if(!VIEWS[page]){page='overview'}
  routeParams=new URLSearchParams(qs||'');
  if(!location.hash)try{history.replaceState(null,'','#/overview')}catch(e){}
  const after=()=>syncModal(evId);
  if(page!==currentPage){showPage(page,after)}else{after()}
}
function syncModal(id){
  const e=id&&BY_ID[id];
  if(e){dlgBody.innerHTML=dialogHTML(e);dlg.dataset.id=id;if(!dlg.open)dlg.showModal();updateRail()}
  else if(dlg.open){suppressClose=true;dlg.close()}
}
dlg.addEventListener('close',()=>{
  if(suppressClose){suppressClose=false;return}
  if(location.hash.indexOf('#/event/')===0){
    if(openedFromApp){openedFromApp=false;history.back()}
    else location.hash='#/finder'+(finderQs?'?'+finderQs:'');
  }
});
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});
window.addEventListener('hashchange',route);

/* ================= actions ================= */
function refresh(){
  const ae=document.activeElement, fk=ae&&ae.dataset&&ae.dataset.fk, y=window.scrollY;
  if(currentPage==='finder')renderResults(false);
  else{view.innerHTML=VIEWS[currentPage]();mountReveals(true);window.scrollTo(0,y)}
  updateRail();
  if(dlg.open&&BY_ID[dlg.dataset.id])dlgBody.innerHTML=dialogHTML(BY_ID[dlg.dataset.id]);
  if(fk){const el=document.querySelector('[data-fk="'+fk+'"]');if(el)el.focus({preventScroll:true})}
}
const toastBox=$('#toasts');
function toast(msg,act){
  const t=document.createElement('div'); t.className='toast';
  const s=document.createElement('span'); s.textContent=msg; t.append(s);
  if(act){const b=document.createElement('button');b.type='button';b.textContent=act.label;b.onclick=()=>{act.fn();t.remove()};t.append(b)}
  toastBox.append(t);
  try{if(toastBox.hidePopover)toastBox.hidePopover();if(toastBox.showPopover)toastBox.showPopover()}catch(e){}
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300)},4200);
}
document.addEventListener('click',ev=>{
  const ea=ev.target.closest('a[href^="#/event/"]'); if(ea)openedFromApp=true;
  const t=ev.target.closest('[data-act]'); if(!t)return;
  const act=t.dataset.act;
  switch(act){
    case 'open': openedFromApp=true; location.hash='#/event/'+t.dataset.id; break;
    case 'close': dlg.close(); break;
    case 'level': F.level=t.dataset.v; syncFinder(); break;
    case 'reset':
      settings.size=''; saveSettings(); F=defaultsF(); finderQs='';
      try{history.replaceState(null,'','#/finder')}catch(e){}
      view.innerHTML=vFinder(); renderResults(false); mountReveals(true); break;
    case 'acc': {
      const item=t.closest('.acc-item'), open=!item.classList.contains('open');
      item.classList.toggle('open',open); t.setAttribute('aria-expanded',String(open)); break;
    }
    case 'print': window.print(); break;
    case 'qstart': Q={mode:'ask',step:0,a:{types:[]}}; renderQuiz(true); break;
    case 'qresult': Q={mode:'result',step:0,a:QR}; renderQuiz(true); break;
    case 'qopt': pickOption(t.dataset.v); break;
    case 'qnext': qNext(); break;
    case 'qback': qBack(); break;
  }
});
document.addEventListener('input',ev=>{
  const t=ev.target, f=t.dataset&&t.dataset.field; if(!f)return;
  if(f==='q'){F.q=t.value;syncFinder()}
});
document.addEventListener('change',ev=>{
  const t=ev.target, f=t.dataset&&t.dataset.field; if(!f)return;
  if(f==='type'){F.type=t.value;syncFinder()}
  else if(f==='format'){F.format=t.value;syncFinder()}
  else if(f==='sort'){F.sort=t.value;syncFinder()}
  else if(f==='size'){F.size=t.value.replace(/\D/g,'');settings.size=F.size;saveSettings();syncFinder()}
  else if(f==='date'){settings.date=t.value;saveSettings();refresh()}
});

route();
})();
</script>
</body>
</html>
